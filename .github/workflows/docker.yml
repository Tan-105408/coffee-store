name: Coffee Store - Build and Push Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # =========================
      # 1. Checkout source code
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Login Docker Hub
      # =========================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # 3. Build Docker image
      # =========================
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/coffee-store:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/coffee-store:${{ github.sha }} .

      # =========================
      # 4. Push Docker image
      # =========================
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/coffee-store:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/coffee-store:${{ github.sha }}